[daemon]
; Pfad zur Log-Datei
log_file = /var/log/sip-daemon.log
; DEBUG | INFO | WARNING | ERROR
log_level = INFO

[sip]
; Auf welcher IP lauschen (0.0.0.0 = alle Interfaces)
bind_address = 0.0.0.0
; SIP-Standardport
bind_port = 5060
; Öffentliche IP für den SIP-Contact-Header (hinter NAT zwingend nötig).
; Wird automatisch via STUN ermittelt. Nur manuell setzen wenn STUN fehlschlägt:
; public_address = 1.2.3.4

[registration]
; Auf true setzen, wenn der Daemon sich beim SIP-Provider/PBX registrieren soll.
; Nicht nötig, wenn der PBX die INVITEs direkt an diese IP schickt.
enabled = true

; Adresse des SIP-Servers / SIP-Providers
server = business2.voipgateway.org
port   = 5060

; Zugangsdaten
username = 41345116490
password  = S+a5m)*0Cd)DG17
domain    = business2.voipgateway.org

; Gültigkeitsdauer der Registration in Sekunden (wird automatisch erneuert)
expires = 300

[handler]
; PHP-Binary (falls nicht im PATH: absoluten Pfad angeben, z.B. /usr/bin/php8.2)
php_binary = php

; Absoluter Pfad zum PHP-Script, das bei eingehenden Anrufen ausgeführt wird.
; Erstes Argument ($argv[1]) = Rufnummer des Anrufers.
; Zusätzlich werden die Umgebungsvariablen CALLER_NUMBER und SIP_INVITE gesetzt.
php_script = /usr/local/share/sip-daemon/handler.php
